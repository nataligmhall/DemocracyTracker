name: Update Democracy Scores

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update:
    name: Fetch GDELT data and update scores
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit and push scores.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the branch we deploy from
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run score updater
        run: python scripts/update_scores.py

      - name: Commit updated scores
        run: |
          git config user.name  "Democracy Tracker Bot"
          git config user.email "democracy-tracker-bot@users.noreply.github.com"
          git add data/scores.json
          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No score changes — skipping commit."
          else
            git commit -m "chore: update democracy scores $(date -u +%Y-%m-%d)"
            git push
          fi
