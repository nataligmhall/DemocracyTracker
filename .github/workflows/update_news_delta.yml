name: Update News Deltas

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Fetch free RSS and update news deltas
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update news deltas
        run: python scripts/update_news_delta.py
        timeout-minutes: 25

      - name: Commit updated scores
        run: |
          git config user.name  "Democracy Tracker Bot"
          git config user.email "democracy-tracker-bot@users.noreply.github.com"
          git add data/scores.json
          if git diff --staged --quiet; then
            echo "No score changes — skipping commit."
          else
            git commit -m "chore: update news deltas $(date -u +%Y-%m-%d)"
            git push
          fi
